<!--
  ═══════════════════════════════════════════════════════════════════════════
  AGENT OS — console shell

  Content lives in /agents-data.js. This file is the interface only. Never
  hardcode an agent or a count here; both are derived from that file.

  NAVIGATION CONTRACT — the thing to not break:
    Every interaction is a CLICK. There is no drag-to-pan, no wheel-zoom, no
    pinch. An earlier build had a free camera and it made the page hostile:
    the canvas swallowed page scroll, and users lost the plot of where they
    were. Movement now happens by DRILLING — you click a department, the view
    flies to that department; you click a tree, it flies to that tree. The
    breadcrumb and the left rail are always sufficient to get back out.

    Views are a small state machine (VIEW.level):
      overview → every node, agents as dots
      brain    → the 12 knowledge documents in a ring
      dept     → one department's trees and their agents
      branch   → one tree's agents, large, labelled
    Nodes keep their identity across views and animate between positions, so
    the transition reads as movement rather than a page swap.

  ACCESSIBILITY: the Ladder tab is a complete, keyboard-native list of all
  137 agents with no SVG involved. If the canvas ever fails, the page still
  works. Do not let that view fall out of sync with the data.
  ═══════════════════════════════════════════════════════════════════════════
-->
<style>
  :root {
    --bg:        #060910;
    --canvas:    #070b14;
    --rail:      #090d17;
    --panel:     #0b101b;
    --raised:    #111726;
    --line:      rgba(150,175,220,.11);
    --line-2:    rgba(150,175,220,.22);
    --ink:       #e9edf6;
    --dim:       #8e97ab;
    --faint:     #5b6478;
    --gold:      #d4af6a;

    --serif: "Fraunces", Georgia, serif;
    --sans:  "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono:  "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --ease:  cubic-bezier(.16,1,.3,1);

    --rail-w: 216px;
    --insp-w: 300px;
    --top-h: 52px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-weight: 300; line-height: 1.55;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  :focus-visible { outline: 1.5px solid var(--gold); outline-offset: 2px; border-radius: 3px; }
  ::selection { background: rgba(212,175,106,.25); }
  .mono { font-family: var(--mono); }
  .skip { position: absolute; left: -9999px; background: var(--ink); color: var(--bg); padding: .7rem 1.1rem; z-index: 200; }
  .skip:focus { left: .5rem; top: .5rem; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(150,175,220,.14); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(150,175,220,.28); }

  /* ── shell ──────────────────────────────────────────── */
  .app { display: grid; grid-template-columns: var(--rail-w) 1fr var(--insp-w); grid-template-rows: var(--top-h) 1fr; height: 100vh; height: 100dvh; }

  .topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 1rem; padding: 0 1rem; border-bottom: 1px solid var(--line); background: var(--rail); z-index: 20; }
  .brand { display: flex; align-items: center; gap: .55rem; padding-right: 1rem; border-right: 1px solid var(--line); margin-right: .3rem; }
  .brand .mark { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--gold); display: grid; place-items: center; font-family: var(--serif); font-size: .7rem; color: var(--gold); flex-shrink: 0; }
  .brand b { font-family: var(--mono); font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; font-weight: 500; white-space: nowrap; }

  .crumbs { display: flex; align-items: center; gap: .4rem; font-family: var(--mono); font-size: .7rem; color: var(--faint); min-width: 0; overflow: hidden; }
  .crumbs button { color: var(--dim); white-space: nowrap; transition: color .2s; }
  .crumbs button:hover { color: var(--ink); }
  .crumbs .sep { opacity: .5; }
  .crumbs .here { color: var(--gold); white-space: nowrap; }

  .top-right { margin-left: auto; display: flex; align-items: center; gap: .5rem; }
  .pill { font-family: var(--mono); font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: .3rem .65rem; transition: all .2s; white-space: nowrap; }
  .pill:hover { color: var(--ink); border-color: var(--line-2); }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #6fcf97; box-shadow: 0 0 8px #6fcf97; display: inline-block; margin-right: .4rem; vertical-align: middle; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }
  .live-dot { animation: blink 2.6s ease-in-out infinite; }

  /* ── left rail ──────────────────────────────────────── */
  .rail { background: var(--rail); border-right: 1px solid var(--line); overflow-y: auto; padding: .9rem 0 2rem; }
  .rail-group { margin-bottom: 1.3rem; }
  .rail-group > h3 { font-family: var(--mono); font-size: .58rem; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); padding: 0 1rem .5rem; }
  .rail-item {
    display: flex; align-items: center; gap: .6rem; width: 100%; text-align: left;
    padding: .42rem 1rem; font-size: .82rem; color: var(--dim);
    border-left: 2px solid transparent; transition: all .18s;
  }
  .rail-item:hover { color: var(--ink); background: rgba(150,175,220,.045); }
  .rail-item[aria-current="true"] { color: var(--ink); background: rgba(150,175,220,.07); border-left-color: var(--c, var(--gold)); }
  .rail-item .swatch { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--dim)); flex-shrink: 0; }
  .rail-item .ico { width: 14px; text-align: center; font-size: .8rem; flex-shrink: 0; }
  .rail-item .n { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rail-item .ct { font-family: var(--mono); font-size: .62rem; color: var(--faint); }

  /* ── centre ─────────────────────────────────────────── */
  .stage { position: relative; display: flex; flex-direction: column; background: var(--canvas); min-width: 0; overflow: hidden; }
  .stage-head { padding: .9rem 1.2rem .75rem; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .stage-title { display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap; }
  .stage-title h1 { font-family: var(--serif); font-size: 1.35rem; font-weight: 400; letter-spacing: -.01em; line-height: 1.1; }
  .stage-title .sub { font-size: .8rem; color: var(--faint); }
  .stage-desc { font-size: .8rem; color: var(--dim); margin-top: .25rem; max-width: 78ch; }

  .cmd { display: flex; align-items: center; gap: .55rem; margin-top: .8rem; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: .5rem .7rem; transition: border-color .2s; }
  .cmd:focus-within { border-color: var(--line-2); }
  .cmd svg { width: 14px; height: 14px; stroke: var(--faint); fill: none; stroke-width: 2; flex-shrink: 0; }
  .cmd input { flex: 1; background: none; border: none; color: var(--ink); font-size: .84rem; min-width: 0; }
  .cmd input:focus { outline: none; }
  .cmd input::placeholder { color: var(--faint); }
  .cmd .hint { font-family: var(--mono); font-size: .6rem; color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: .12rem .35rem; white-space: nowrap; }

  .tabs { display: flex; gap: .25rem; margin-top: .7rem; }
  .tab { font-family: var(--mono); font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; padding: .32rem .8rem; border-radius: 6px; color: var(--faint); transition: all .2s; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--bg); font-weight: 500; }

  .canvas-wrap { position: relative; flex: 1; min-height: 0; }
  .grid-bg {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(150,175,220,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(150,175,220,.055) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(ellipse 78% 78% at 50% 50%, #000 35%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 78% 78% at 50% 50%, #000 35%, transparent 100%);
  }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .canvas-foot { position: absolute; left: 1rem; bottom: .8rem; font-family: var(--mono); font-size: .62rem; color: var(--faint); letter-spacing: .06em; pointer-events: none; }
  .back-btn { position: absolute; left: 1rem; top: 1rem; display: flex; align-items: center; gap: .45rem; font-family: var(--mono); font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: .35rem .8rem; transition: all .2s; opacity: 0; pointer-events: none; }
  .back-btn.on { opacity: 1; pointer-events: auto; }
  .back-btn:hover { color: var(--ink); border-color: var(--line-2); }

  /* svg */
  .link { stroke-width: .8; fill: none; transition: opacity .5s var(--ease), stroke-width .25s; }
  .node { cursor: pointer; transition: transform .62s var(--ease), opacity .42s var(--ease); }
  .node.hidden { opacity: 0; pointer-events: none; }
  .node circle { transition: r .5s var(--ease), fill-opacity .3s, stroke-width .2s; }
  .node text { font-family: var(--sans); pointer-events: none; transition: opacity .35s; }
  .node .lbl { opacity: 0; }
  .node.show-lbl .lbl { opacity: 1; }
  .node.faded { opacity: .13; }
  .node:hover circle { stroke-width: 2.4; }
  .node.sel circle { stroke: #fff; stroke-width: 2.6; }
  .node.sel text.lbl { fill: #fff !important; opacity: 1; }
  .node.sel { filter: drop-shadow(0 0 9px rgba(255,255,255,.35)); }
  .ring-guide { fill: none; stroke: rgba(150,175,220,.075); stroke-dasharray: 2 6; transition: opacity .5s; }

  .brain-ring { fill: none; stroke: var(--gold); stroke-opacity: .3; }
  @keyframes halo { 0%,100%{ opacity:.35; r:58 } 50%{ opacity:.1; r:70 } }
  .brain-halo { animation: halo 5.5s ease-in-out infinite; }

  .tip { position: absolute; pointer-events: none; background: var(--raised); border: 1px solid var(--line-2); border-radius: 7px; padding: .45rem .65rem; font-size: .76rem; opacity: 0; transition: opacity .18s; z-index: 15; white-space: nowrap; box-shadow: 0 8px 22px rgba(0,0,0,.5); }
  .tip.on { opacity: 1; }
  .tip b { display: block; font-weight: 500; }
  .tip span { font-family: var(--mono); font-size: .62rem; color: var(--faint); letter-spacing: .06em; }

  /* ── ladder ─────────────────────────────────────────── */
  .ladder { flex: 1; min-height: 0; overflow-y: auto; padding: 1.2rem 1.2rem 3rem; }
  .phase h2 { font-family: var(--serif); font-size: 1.15rem; font-weight: 400; }
  .phase { margin-bottom: 2rem; }
  .phase-top { display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: .5rem; margin-bottom: .7rem; }
  .phase-top .w { font-family: var(--mono); font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
  .phase-top .nt { font-size: .78rem; color: var(--faint); flex: 1 1 100%; }
  .lrow { display: grid; grid-template-columns: 26px 1.3fr 1.1fr 84px; gap: .9rem; align-items: center; width: 100%; text-align: left; padding: .5rem .7rem; border-radius: 7px; border: 1px solid transparent; transition: all .18s; }
  .lrow:hover { background: var(--panel); border-color: var(--line); }
  .lrow .i { font-family: var(--mono); font-size: .62rem; color: var(--faint); }
  .lrow .nm { font-size: .88rem; }
  .lrow .nm small { display: block; font-family: var(--mono); font-size: .6rem; letter-spacing: .08em; text-transform: uppercase; margin-top: .1rem; }
  .lrow .rp { font-size: .76rem; color: var(--faint); }
  .lrow .tr { font-family: var(--mono); font-size: .6rem; letter-spacing: .08em; text-transform: uppercase; text-align: right; }
  .brain-row { border-color: rgba(212,175,106,.3) !important; background: rgba(212,175,106,.04); margin-bottom: .4rem; }

  /* ── inspector ──────────────────────────────────────── */
  .insp { background: var(--rail); border-left: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
  .insp-scroll { overflow-y: auto; flex: 1; }
  .sect { border-bottom: 1px solid var(--line); padding: .85rem 1rem; }
  .sect > h3 { font-family: var(--mono); font-size: .58rem; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); margin-bottom: .6rem; display: flex; justify-content: space-between; }
  .kv { display: flex; justify-content: space-between; align-items: baseline; padding: .22rem 0; font-size: .8rem; }
  .kv span { color: var(--dim); }
  .kv b { font-family: var(--mono); font-weight: 500; font-size: .8rem; }

  .layer { display: flex; align-items: center; gap: .55rem; width: 100%; padding: .34rem .35rem; border-radius: 5px; font-size: .79rem; color: var(--dim); transition: all .18s; }
  .layer:hover { background: rgba(150,175,220,.05); color: var(--ink); }
  .layer .sw { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex-shrink: 0; transition: opacity .2s; }
  .layer[aria-pressed="false"] { opacity: .4; }
  .layer[aria-pressed="false"] .sw { opacity: .25; }
  .layer .n { flex: 1; text-align: left; }
  .layer .ct { font-family: var(--mono); font-size: .64rem; color: var(--faint); }

  .dir { padding: .3rem .5rem 1rem; }
  .dir-item { display: flex; align-items: center; gap: .5rem; width: 100%; padding: .34rem .5rem; border-radius: 5px; text-align: left; transition: all .16s; }
  .dir-item:hover { background: rgba(150,175,220,.055); }
  .dir-item.sel { background: rgba(212,175,106,.09); }
  .dir-item .sw { width: 6px; height: 6px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
  .dir-item .n { flex: 1; font-size: .78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dir-item .t { font-family: var(--mono); font-size: .55rem; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
  .dir-empty { padding: 1.5rem .8rem; text-align: center; font-size: .78rem; color: var(--faint); }

  /* agent detail inside inspector */
  .det-head { padding: .9rem 1rem .8rem; border-bottom: 1px solid var(--line); }
  .det-head .pth { font-family: var(--mono); font-size: .6rem; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin-bottom: .4rem; }
  .det-head h2 { font-family: var(--serif); font-size: 1.15rem; font-weight: 400; line-height: 1.15; }
  .badges { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .6rem; }
  .badge { font-family: var(--mono); font-size: .56rem; letter-spacing: .09em; text-transform: uppercase; padding: .2rem .5rem; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .badge.solid { color: var(--bg); font-weight: 500; }
  .fld { margin-bottom: 1rem; }
  .fld h4 { font-family: var(--mono); font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin-bottom: .3rem; }
  .fld p { font-size: .82rem; }
  .chiprow { display: flex; flex-wrap: wrap; gap: .25rem; }
  .kbchip { font-family: var(--mono); font-size: .58rem; padding: .22rem .45rem; border: 1px solid var(--line); border-radius: 4px; color: var(--dim); transition: all .18s; }
  .kbchip:hover { border-color: var(--gold); color: var(--gold); }

  .var { margin-bottom: .5rem; }
  .var label { display: block; font-family: var(--mono); font-size: .56rem; letter-spacing: .1em; color: var(--gold); margin-bottom: .18rem; }
  .var textarea { width: 100%; background: var(--canvas); border: 1px solid var(--line); border-radius: 5px; padding: .4rem .5rem; color: var(--ink); font-family: var(--sans); font-size: .78rem; resize: vertical; min-height: 2.1rem; }
  .var textarea:focus { outline: none; border-color: var(--line-2); }

  .skill { background: var(--canvas); border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .skill-bar { display: flex; align-items: center; gap: .35rem; padding: .4rem .5rem; border-bottom: 1px solid var(--line); }
  .skill-bar span { font-family: var(--mono); font-size: .56rem; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-right: auto; }
  .mini { font-family: var(--mono); font-size: .58rem; letter-spacing: .07em; text-transform: uppercase; padding: .24rem .5rem; border: 1px solid var(--line); border-radius: 4px; color: var(--dim); transition: all .18s; }
  .mini:hover { color: var(--ink); border-color: var(--line-2); }
  .mini.go { background: var(--gold); border-color: var(--gold); color: var(--bg); font-weight: 500; }
  .mini.go:hover { filter: brightness(1.1); }
  .skill pre { padding: .6rem; font-family: var(--mono); font-size: .67rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; max-height: 340px; overflow-y: auto; }
  .skill pre mark { background: rgba(212,175,106,.18); color: var(--gold); border-radius: 2px; }

  .built { display: flex; align-items: center; gap: .5rem; width: 100%; padding: .5rem .6rem; border: 1px solid var(--line); border-radius: 6px; margin-bottom: .9rem; transition: all .18s; }
  .built:hover { border-color: var(--line-2); }
  .built .bx { width: 14px; height: 14px; border: 1px solid var(--line-2); border-radius: 3px; display: grid; place-items: center; font-size: .6rem; flex-shrink: 0; }
  .built[aria-pressed="true"] { border-color: #a8b878; }
  .built[aria-pressed="true"] .bx { background: #a8b878; border-color: #a8b878; color: var(--bg); }
  .built span { font-size: .78rem; color: var(--dim); }

  .kbdoc { border: 1px solid var(--line); border-radius: 6px; padding: .6rem .7rem; margin-bottom: .45rem; }
  .kbdoc h5 { font-family: var(--serif); font-size: .92rem; font-weight: 400; margin-bottom: .2rem; }
  .kbdoc p { font-size: .76rem; color: var(--dim); margin-bottom: .35rem; }
  .kbdoc .tpl { font-family: var(--mono); font-size: .62rem; color: var(--faint); line-height: 1.65; }
  .kbdoc .rd { font-family: var(--mono); font-size: .56rem; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); margin-top: .35rem; }

  .toast { position: fixed; bottom: 1.2rem; left: 50%; transform: translate(-50%,220%); background: var(--ink); color: var(--bg); font-size: .78rem; font-weight: 500; padding: .5rem 1rem; border-radius: 999px; z-index: 300; transition: transform .4s var(--ease); }
  .toast.on { transform: translate(-50%,0); }

  /* ── responsive ─────────────────────────────────────── */
  .rail-toggle, .insp-toggle { display: none; }
  @media (max-width: 1180px) { :root { --rail-w: 180px; --insp-w: 260px; } }
  @media (max-width: 960px) {
    body { overflow: auto; }
    .app { grid-template-columns: 1fr; grid-template-rows: var(--top-h) auto auto auto; height: auto; }
    /* the three top-right pills cannot share a row with the breadcrumb at
       phone widths; they overflow by a hair and produce a horizontal scroll */
    .top-right .pill:not(:first-child) { display: none; }
    .topbar { overflow: hidden; }
    .crumbs { flex-shrink: 1; }
    .rail { max-height: 280px; }
    .rail-item { padding-block: .34rem; }
    .rail-group { margin-bottom: .9rem; }
  }
  @media (max-width: 620px) {
    /* at this width the wordmark and the status pill together squeeze the
       breadcrumb into an ellipsis; the breadcrumb is the one that navigates */
    .brand b { display: none; }
    .brand { padding-right: .6rem; }
    .top-right { display: none; }
    .rail { border-right: none; border-bottom: 1px solid var(--line); max-height: 210px; }
    .stage { height: 78vh; }
    .insp { border-left: none; border-top: 1px solid var(--line); max-height: none; }
    .insp-scroll { overflow: visible; }
  }
</style>
</head>

<a class="skip" href="#ladder-tab">Skip the map, list all agents</a>

<div class="app">

  <!-- ══ top bar ══ -->

<script src="/agents-data.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════════════════ */
const SVGNS = "http://www.w3.org/2000/svg";
const C = 500;
const el   = id => document.getElementById(id);
const byId = (a, id) => a.find(x => x.i === id);
const esc  = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const mk   = (t, a = {}) => { const n = document.createElementNS(SVGNS, t); for (const k in a) n.setAttribute(k, a[k]); return n; };
const pol  = (r, deg) => { const t = (deg - 90) * Math.PI / 180; return [C + r * Math.cos(t), C + r * Math.sin(t)]; };

const branchOf = a => byId(BRANCHES, a.b);
const deptOf   = a => byId(DEPTS, branchOf(a).d);
const branchesIn = d => BRANCHES.filter(b => b.d === d);
const agentsIn   = b => AGENTS.filter(a => a.b === b);
const agentsInDept = d => AGENTS.filter(a => branchOf(a).d === d);

/* ═══════════════════════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════════════════ */
const BUILT_KEY = "cms.agentmap.built";
const VIEW  = { level: "overview", dept: null, branch: null };
const state = {
  q: "",
  tiers: new Set(Object.keys(TIERS)),   // all layers on by default
  sel: null,                             // selected agent id
  selKb: null,
  built: new Set(JSON.parse(localStorage.getItem(BUILT_KEY) || "[]")),
  tab: "map"
};
const saveBuilt = () => localStorage.setItem(BUILT_KEY, JSON.stringify([...state.built]));

function agentMatches(a) {
  if (!state.tiers.has(a.t)) return false;
  if (!state.q) return true;
  const hay = (a.n + " " + a.r + " " + a.in + " " + a.out + " " + a.s + " " +
               branchOf(a).n + " " + deptOf(a).n).toLowerCase();
  return hay.includes(state.q);
}

/* ═══════════════════════════════════════════════════════════════════════════
   BASE ANGLES — the overview ring. Each department owns an arc sized by its
   agent count, so the outer ring is evenly spaced whatever the split is.
   ═══════════════════════════════════════════════════════════════════════ */
const ANG = { dept: {}, branch: {}, agent: {} };
(function baseAngles() {
  const GAP = 4;
  const unit = (360 - DEPTS.length * GAP) / AGENTS.length;
  let cur = -DEPTS.length * GAP / 2;
  for (const d of DEPTS) {
    const start = cur;
    for (const b of branchesIn(d.i)) {
      const kids = agentsIn(b.i), bs = cur;
      kids.forEach((a, i) => { ANG.agent[a.i] = bs + (i + .5) * unit; });
      cur += kids.length * unit;
      ANG.branch[b.i] = (bs + cur) / 2;
    }
    ANG.dept[d.i] = (start + cur) / 2;
    cur += GAP;
  }
})();

/* ═══════════════════════════════════════════════════════════════════════════
   LAYOUT — one function per view. Returns a map of nodeId → placement, plus
   the links to draw and the guide rings. Nothing here mutates the DOM.
   ═══════════════════════════════════════════════════════════════════════ */
function layoutFor(v) {
  const pos = {}, links = [], guides = [];
  const put = (id, r, deg, size, label) => {
    const [x, y] = pol(r, deg);
    pos[id] = { x, y, r: size, deg, label: !!label };
  };

  if (v.level === "overview") {
    pos.brain = { x: C, y: C, r: 44, deg: 0, label: true };
    guides.push(158, 256, 348);
    for (const d of DEPTS) {
      put("dept:" + d.i, 158, ANG.dept[d.i], 13, true);
      links.push(["brain", "dept:" + d.i, d.c, .34]);
      for (const b of branchesIn(d.i)) {
        /* 33 horizontal labels at this radius collide into noise. Tree names
           appear on hover and once you drill into the department. */
        put("branch:" + b.i, 256, ANG.branch[b.i], 7, false);
        links.push(["dept:" + d.i, "branch:" + b.i, d.c, .26]);
        for (const a of agentsIn(b.i)) {
          put("agent:" + a.i, 348, ANG.agent[a.i], 4.4, false);
          links.push(["branch:" + b.i, "agent:" + a.i, d.c, .2]);
        }
      }
    }
  }

  else if (v.level === "brain") {
    pos.brain = { x: C, y: C, r: 56, deg: 0, label: true };
    guides.push(268);
    BRAIN.forEach((k, i) => {
      put("kb:" + k.i, 268, (360 / BRAIN.length) * i, 17, true);
      links.push(["brain", "kb:" + k.i, "#d4af6a", .3]);
    });
  }

  else if (v.level === "dept") {
    const d = byId(DEPTS, v.dept);
    const bs = branchesIn(d.i), total = agentsInDept(d.i).length;
    const GAP = 6, unit = (360 - bs.length * GAP) / total;
    pos.brain = { x: C, y: C, r: 28, deg: 0, label: true };
    guides.push(186, 332);
    let cur = -bs.length * GAP / 2;
    for (const b of bs) {
      const kids = agentsIn(b.i), start = cur;
      kids.forEach((a, i) => put("agent:" + a.i, 332, start + (i + .5) * unit, 6.5, true));
      cur += kids.length * unit;
      put("branch:" + b.i, 186, (start + cur) / 2, 12, true);
      links.push(["brain", "branch:" + b.i, d.c, .3]);
      for (const a of kids) links.push(["branch:" + b.i, "agent:" + a.i, d.c, .24]);
      cur += GAP;
    }
  }

  else if (v.level === "branch") {
    const b = byId(BRANCHES, v.branch), d = byId(DEPTS, b.d), kids = agentsIn(b.i);
    pos.brain = { x: C, y: C, r: 30, deg: 0, label: true };
    guides.push(300);
    kids.forEach((a, i) => {
      put("agent:" + a.i, 300, (360 / kids.length) * i, 17, true);
      links.push(["brain", "agent:" + a.i, d.c, .3]);
    });
  }

  return { pos, links, guides };
}

/* ═══════════════════════════════════════════════════════════════════════════
   NODE CONSTRUCTION — built once, then only moved. Keeping identity across
   views is what makes drilling read as movement rather than a page swap.
   ═══════════════════════════════════════════════════════════════════════ */
const gGuides = el("g-guides"), gLinks = el("g-links"), gNodes = el("g-nodes");
const N = {};          // id → { g, circle, label }
const linkPool = [];   // reusable <line> elements

function nodeShell(id, cls, colour, onClick, aria) {
  const g = mk("g", { class: "node " + cls, tabindex: "0", role: "button" });
  g.setAttribute("aria-label", aria);
  g.style.transform = `translate(${C}px, ${C}px)`;
  g.addEventListener("click", onClick);
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onClick(); } });
  gNodes.appendChild(g);
  N[id] = { g, colour };
  return g;
}

function buildNodes() {
  /* the brain */
  const bg = nodeShell("brain", "n-brain", "#d4af6a", () => go({ level: "brain" }),
    "The company brain — " + BRAIN.length + " shared knowledge documents");
  bg.appendChild(mk("circle", { r: 100, fill: "url(#glow)" }));
  bg.appendChild(mk("circle", { class: "brain-halo brain-ring", r: 58 }));
  const bc = mk("circle", { class: "core", r: 44, fill: "#0b101b", stroke: "#d4af6a", "stroke-width": "1.4" });
  bg.appendChild(bc);
  const t1 = mk("text", { y: -2, "text-anchor": "middle", fill: "#e9edf6", "font-family": "Fraunces, serif", "font-size": "14" });
  t1.textContent = "COMPANY";
  const t2 = mk("text", { y: 13, "text-anchor": "middle", fill: "#e9edf6", "font-family": "Fraunces, serif", "font-size": "14" });
  t2.textContent = "BRAIN";
  const t3 = mk("text", { y: 27, "text-anchor": "middle", fill: "#5b6478", "font-family": "JetBrains Mono, monospace", "font-size": "7", "letter-spacing": "1.5" });
  t3.textContent = BRAIN.length + " DOCS";
  bg.append(t1, t2, t3);
  N.brain.core = bc; N.brain.texts = [t1, t2, t3];

  /* knowledge documents */
  for (const k of BRAIN) {
    const g = nodeShell("kb:" + k.i, "n-kb", "#d4af6a", () => selectKb(k.i), k.n + " — knowledge document");
    g.appendChild(mk("circle", { r: 15, fill: "#0b101b", stroke: "#d4af6a", "stroke-width": "1.2" }));
    const rd = AGENTS.filter(a => a.k.includes(k.i)).length;
    const t = mk("text", { class: "lbl", y: 3, "text-anchor": "middle", fill: "#d4af6a", "font-size": "8", "font-family": "JetBrains Mono, monospace" });
    t.textContent = rd;
    const nm = mk("text", { class: "lbl", y: 30, "text-anchor": "middle", fill: "#8e97ab", "font-size": "9" });
    nm.textContent = k.n;
    g.append(t, nm);
    N["kb:" + k.i].circle = g.querySelector("circle");
  }

  /* departments */
  for (const d of DEPTS) {
    const g = nodeShell("dept:" + d.i, "n-dept", d.c, () => go({ level: "dept", dept: d.i }),
      d.n + " department — " + agentsInDept(d.i).length + " agents");
    const c = mk("circle", { r: 13, fill: d.c, "fill-opacity": ".15", stroke: d.c, "stroke-width": "1.4" });
    g.appendChild(c);
    const e = mk("text", { y: 4, "text-anchor": "middle", "font-size": "11" });
    e.textContent = d.e;
    const nm = mk("text", { class: "lbl", y: -21, "text-anchor": "middle", fill: d.c, "font-family": "Fraunces, serif", "font-size": "12" });
    nm.textContent = d.n;
    g.append(e, nm);
    N["dept:" + d.i].circle = c;
  }

  /* branches */
  for (const b of BRANCHES) {
    const d = byId(DEPTS, b.d);
    const g = nodeShell("branch:" + b.i, "n-branch", d.c, () => go({ level: "branch", branch: b.i }),
      b.n + " tree, " + d.n + " — " + agentsIn(b.i).length + " agents");
    const c = mk("circle", { r: 7, fill: "#0b101b", stroke: d.c, "stroke-width": "1.2" });
    g.appendChild(c);
    const nm = mk("text", { class: "lbl", "text-anchor": "middle", y: -14, fill: d.c, "font-size": "9" });
    nm.textContent = b.n;
    g.appendChild(nm);
    g.addEventListener("mouseenter", ev => showTipRaw(ev, b.n, d.n + " · " + agentsIn(b.i).length + " agents"));
    g.addEventListener("mousemove", moveTip);
    g.addEventListener("mouseleave", hideTip);
    N["branch:" + b.i].circle = c; N["branch:" + b.i].label = nm;
  }

  /* agents */
  for (const a of AGENTS) {
    const d = deptOf(a);
    const g = nodeShell("agent:" + a.i, "n-agent", d.c, () => selectAgent(a.i),
      a.n + " — " + branchOf(a).n + ", " + d.n + ". " + TIERS[a.t].label + ", phase " + a.p);
    const c = mk("circle", {
      r: 4.4, fill: d.c, stroke: d.c, "stroke-width": ".9",
      "fill-opacity": a.t === "autonomous" ? ".95" : a.t === "assisted" ? ".45" : ".1"
    });
    g.appendChild(c);
    const nm = mk("text", { class: "lbl", "text-anchor": "middle", y: -12, fill: "#8e97ab", "font-size": "8" });
    nm.textContent = a.n.length > 22 ? a.n.slice(0, 21) + "…" : a.n;
    g.appendChild(nm);
    g.addEventListener("mouseenter", ev => showTip(ev, a));
    g.addEventListener("mousemove", ev => moveTip(ev));
    g.addEventListener("mouseleave", hideTip);
    N["agent:" + a.i].circle = c; N["agent:" + a.i].label = nm;
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   RENDER — apply a layout. Nodes move via CSS transition; links are tweened
   by hand because SVG line endpoints are attributes, not CSS properties.
   ═══════════════════════════════════════════════════════════════════════ */
let linkAnim = null;

function render() {
  const { pos, links, guides } = layoutFor(VIEW);

  /* guide rings */
  gGuides.textContent = "";
  for (const r of guides) gGuides.appendChild(mk("circle", { class: "ring-guide", cx: C, cy: C, r }));

  /* nodes */
  for (const id in N) {
    const n = N[id], p = pos[id];
    if (!p) { n.g.classList.add("hidden"); continue; }
    n.g.classList.remove("hidden");
    n.g.style.transform = `translate(${p.x}px, ${p.y}px)`;
    n.g.classList.toggle("show-lbl", p.label);
    if (n.circle) n.circle.setAttribute("r", p.r);
    if (id === "brain") {
      n.core.setAttribute("r", p.r);
      const small = p.r < 40;
      n.texts.forEach((t, i) => t.setAttribute("opacity", small && i > 0 ? 0 : 1));
      n.texts[0].setAttribute("y", small ? 4 : -2);
      n.texts[0].textContent = small ? "BRAIN" : "COMPANY";
    }
    /* keep labels upright but pushed outward on the ring */
    if (n.label && p.deg !== undefined && id !== "brain") {
      const out = p.deg > 90 && p.deg < 270;
      n.label.setAttribute("y", out ? p.r + 13 : -(p.r + 7));
    }
  }

  /* links */
  while (linkPool.length < links.length) {
    const l = mk("line", { class: "link" });
    gLinks.appendChild(l); linkPool.push(l);
  }
  linkPool.forEach((l, i) => {
    const spec = links[i];
    if (!spec) { l.style.display = "none"; return; }
    l.style.display = "";
    l.setAttribute("stroke", spec[2]);
    l.setAttribute("stroke-opacity", spec[3]);
    const a = pos[spec[0]], b = pos[spec[1]];
    l._to = [a.x, a.y, b.x, b.y];
    l._from = [
      +l.getAttribute("x1") || C, +l.getAttribute("y1") || C,
      +l.getAttribute("x2") || C, +l.getAttribute("y2") || C
    ];
  });

  cancelAnimationFrame(linkAnim);
  const t0 = performance.now(), DUR = 620;
  (function step(now) {
    const t = Math.min(1, (now - t0) / DUR), e = 1 - Math.pow(1 - t, 5);
    for (const l of linkPool) {
      if (!l._to || l.style.display === "none") continue;
      const f = l._from, u = l._to;
      l.setAttribute("x1", f[0] + (u[0] - f[0]) * e);
      l.setAttribute("y1", f[1] + (u[1] - f[1]) * e);
      l.setAttribute("x2", f[2] + (u[2] - f[2]) * e);
      l.setAttribute("y2", f[3] + (u[3] - f[3]) * e);
    }
    if (t < 1) linkAnim = requestAnimationFrame(step);
  })(t0);

  applyDimming();
}

/* search + layer filters dim rather than remove, so the shape stays readable */
function applyDimming() {
  for (const a of AGENTS) {
    const n = N["agent:" + a.i];
    n.g.classList.toggle("faded", !agentMatches(a));
    n.g.classList.toggle("sel", state.sel === a.i);
  }
  for (const b of BRANCHES) {
    const any = agentsIn(b.i).some(agentMatches);
    N["branch:" + b.i].g.classList.toggle("faded", !any);
  }
  for (const d of DEPTS) {
    const any = agentsInDept(d.i).some(agentMatches);
    N["dept:" + d.i].g.classList.toggle("faded", !any);
  }
  for (const k of BRAIN) N["kb:" + k.i].g.classList.toggle("sel", state.selKb === k.i);
}

/* ═══════════════════════════════════════════════════════════════════════════
   NAVIGATION — click only. go() is the single entry point for every move.
   ═══════════════════════════════════════════════════════════════════════ */
function go(v, keepSel) {
  VIEW.level = v.level;
  VIEW.dept = v.dept || null;
  VIEW.branch = v.branch || null;
  if (!keepSel) { state.sel = null; state.selKb = null; }
  render();
  paintChrome();
  if (state.tab !== "map") setTab("map");
  if (!keepSel) renderInspector();
  syncHash();
}

function up() {
  if (VIEW.level === "branch") return go({ level: "dept", dept: byId(BRANCHES, VIEW.branch).d });
  return go({ level: "overview" });
}

function crumbTrail() {
  const t = [{ label: "Overview", act: () => go({ level: "overview" }) }];
  if (VIEW.level === "brain") t.push({ label: "Company Brain", here: true });
  if (VIEW.level === "dept") t.push({ label: byId(DEPTS, VIEW.dept).n, here: true });
  if (VIEW.level === "branch") {
    const b = byId(BRANCHES, VIEW.branch), d = byId(DEPTS, b.d);
    t.push({ label: d.n, act: () => go({ level: "dept", dept: d.i }) });
    t.push({ label: b.n, here: true });
  }
  return t;
}

/* title, breadcrumb, rail state, footer — everything that frames the canvas */
function paintChrome() {
  const trail = crumbTrail();
  el("crumbs").innerHTML = trail.map((c, i) =>
    (i ? '<span class="sep">/</span>' : "") +
    (c.here ? `<span class="here">${esc(c.label)}</span>` : `<button data-crumb="${i}">${esc(c.label)}</button>`)
  ).join("");
  el("crumbs").querySelectorAll("[data-crumb]").forEach(b =>
    b.addEventListener("click", () => trail[+b.dataset.crumb].act()));

  let h1 = "Agent OS", sub = "", desc = "", foot = "Click a department to drill in";
  if (VIEW.level === "overview") {
    h1 = "Agent OS";
    sub = `${AGENTS.length} agents · ${DEPTS.length} departments · ${BRANCHES.length} trees`;
    desc = "Every agent reads from the brain at the centre. Click a department to open its trees, a tree to open its agents, or any agent for the runnable skill.";
  } else if (VIEW.level === "brain") {
    h1 = "Company Brain";
    sub = `${BRAIN.length} documents`;
    desc = `Build these ${BRAIN.length} documents first. They are what stop ${AGENTS.length} agents inventing your prices, proof and voice. Click a document for its template.`;
    foot = "Click a document to open its template";
  } else if (VIEW.level === "dept") {
    const d = byId(DEPTS, VIEW.dept);
    h1 = d.e + " " + d.n;
    sub = `${branchesIn(d.i).length} trees · ${agentsInDept(d.i).length} agents`;
    desc = d.d;
    foot = "Click a tree to open it, or an agent for its skill";
  } else if (VIEW.level === "branch") {
    const b = byId(BRANCHES, VIEW.branch), d = byId(DEPTS, b.d);
    h1 = b.n;
    sub = `${d.n} · ${agentsIn(b.i).length} agents`;
    desc = b.d2;
    foot = "Click an agent for its runnable skill";
  }
  el("stage-h1").textContent = h1;
  el("stage-sub").textContent = sub;
  el("stage-desc").textContent = desc;
  el("foot").textContent = foot;
  el("back-btn").classList.toggle("on", VIEW.level !== "overview");

  document.querySelectorAll(".rail-item").forEach(r => r.setAttribute("aria-current", "false"));
  const railSel =
    VIEW.level === "overview" ? '[data-go="overview"]' :
    VIEW.level === "brain" ? '[data-go="brain"]' :
    `[data-dept="${VIEW.level === "dept" ? VIEW.dept : byId(BRANCHES, VIEW.branch || "").d}"]`;
  const r = document.querySelector(railSel);
  if (r) r.setAttribute("aria-current", "true");
}

function syncHash() {
  const h = VIEW.level === "overview" ? "" :
            VIEW.level === "brain" ? "#brain" :
            VIEW.level === "dept" ? "#dept=" + VIEW.dept : "#tree=" + VIEW.branch;
  history.replaceState(null, "", location.pathname + (state.sel ? "#agent=" + state.sel : h));
}

/* ═══════════════════════════════════════════════════════════════════════════
   SELECTION
   ═══════════════════════════════════════════════════════════════════════ */
/* Selecting an agent that is not on screen — from the ladder, a brain
   document, or a deep link — would otherwise show a detail panel for a node
   the user cannot see. Drill to its tree first so the map and the panel
   always agree. */
function selectAgent(id) {
  const a = byId(AGENTS, id);
  if (!a) return;
  const visible =
    VIEW.level === "overview" ||
    (VIEW.level === "dept" && branchOf(a).d === VIEW.dept) ||
    (VIEW.level === "branch" && a.b === VIEW.branch);
  if (!visible) { VIEW.level = "branch"; VIEW.branch = a.b; VIEW.dept = null; render(); paintChrome(); }
  state.sel = id; state.selKb = null;
  applyDimming(); renderInspector(); syncHash();
}
function selectKb(id) { state.selKb = id; state.sel = null; applyDimming(); renderInspector(); }

/* ═══════════════════════════════════════════════════════════════════════════
   INSPECTOR — LIVE / LAYERS / DIRECTORY, or the detail of what is selected.
   ═══════════════════════════════════════════════════════════════════════ */
function currentAgents() {
  if (VIEW.level === "dept") return agentsInDept(VIEW.dept);
  if (VIEW.level === "branch") return agentsIn(VIEW.branch);
  return AGENTS;
}

function renderInspector() {
  if (state.sel) return renderAgentDetail(byId(AGENTS, state.sel));
  if (state.selKb) return renderKbDetail(byId(BRAIN, state.selKb));
  renderPanels();
}

function renderPanels() {
  const scope = currentAgents();
  const shown = scope.filter(agentMatches);
  const built = scope.filter(a => state.built.has(a.i)).length;

  const layers = Object.entries(TIERS).map(([k, t]) => {
    const ct = scope.filter(a => a.t === k).length;
    return `<button class="layer" data-tier="${k}" style="--c:${t.c}" aria-pressed="${state.tiers.has(k)}" title="${esc(t.hint)}">
      <span class="sw"></span><span class="n">${esc(t.label)}</span><span class="ct">${ct}</span></button>`;
  }).join("");

  const dirRows = shown.length ? shown.map(a => {
    const d = deptOf(a);
    return `<button class="dir-item${state.sel === a.i ? " sel" : ""}" data-agent="${a.i}" style="--c:${d.c}">
      <span class="sw"></span>
      <span class="n">${state.built.has(a.i) ? "✓ " : ""}${esc(a.n)}</span>
      <span class="t">${esc(TIERS[a.t].label.slice(0, 4))}</span>
    </button>`;
  }).join("") : `<p class="dir-empty">Nothing matches. Clear the search or re-enable a layer.</p>`;

  el("insp").innerHTML = `
    <div class="sect">
      <h3>Live</h3>
      <div class="kv"><span>In view</span><b>${shown.length}${shown.length !== scope.length ? " / " + scope.length : ""}</b></div>
      <div class="kv"><span>Trees</span><b>${VIEW.level === "branch" ? 1 : VIEW.level === "dept" ? branchesIn(VIEW.dept).length : BRANCHES.length}</b></div>
      <div class="kv"><span>Marked built</span><b>${built}</b></div>
    </div>
    <div class="sect">
      <h3>Layers <span>autonomy</span></h3>
      ${layers}
    </div>
    <div class="sect" style="border-bottom:none">
      <h3>Directory <span>${shown.length}</span></h3>
    </div>
    <div class="dir">${dirRows}</div>`;

  el("insp").querySelectorAll("[data-tier]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.tier;
    if (state.tiers.has(k)) { if (state.tiers.size > 1) state.tiers.delete(k); }
    else state.tiers.add(k);
    applyDimming(); renderPanels(); renderLadder();
  }));
  el("insp").querySelectorAll("[data-agent]").forEach(b =>
    b.addEventListener("click", () => selectAgent(b.dataset.agent)));
}

const varsOf = s => [...new Set((s.match(/\{\{[A-Z0-9_]+\}\}/g) || []))];
const hi = s => esc(s).replace(/\{\{[A-Z0-9_]+\}\}/g, m => `<mark>${m}</mark>`);

function filledSkill(a) {
  let out = a.s;
  document.querySelectorAll("#insp [data-var]").forEach(t => {
    if (t.value.trim()) out = out.split(t.dataset.var).join(t.value.trim());
  });
  return out;
}

function renderAgentDetail(a) {
  const d = deptOf(a), b = branchOf(a), t = TIERS[a.t], ph = PHASES[a.p];
  const isBuilt = state.built.has(a.i);
  const vars = varsOf(a.s);

  el("insp").innerHTML = `
    <div class="det-head">
      <p class="pth"><button class="mini" id="back-dir">← Directory</button></p>
      <p class="pth" style="margin-top:.5rem;color:${d.c}">${esc(d.e)} ${esc(d.n)} › ${esc(b.n)}</p>
      <h2>${esc(a.n)}</h2>
      <div class="badges">
        <span class="badge solid" style="background:${t.c};border-color:${t.c}">${esc(t.label)}</span>
        <span class="badge">Phase ${a.p} · ${esc(ph.label)}</span>
        <span class="badge">${esc(ph.when)}</span>
      </div>
    </div>
    <div class="sect" style="border-bottom:none">
      <button class="built" id="built-btn" aria-pressed="${isBuilt}">
        <span class="bx">${isBuilt ? "✓" : ""}</span>
        <span>${isBuilt ? "Built — running in your stack" : "Mark as built"}</span>
      </button>

      <div class="fld"><h4>Replaces</h4><p>${esc(a.r)}</p></div>
      <div class="fld"><h4>Autonomy — ${esc(t.label)}</h4><p style="color:var(--dim);font-size:.78rem">${esc(t.hint)}</p></div>
      <div class="fld"><h4>Needs</h4><p style="font-size:.78rem">${esc(a.in)}</p></div>
      <div class="fld"><h4>Returns</h4><p style="font-size:.78rem">${esc(a.out)}</p></div>
      <div class="fld"><h4>Reads from the brain</h4>
        <div class="chiprow">${a.k.map(k => {
          const doc = byId(BRAIN, k);
          return `<button class="kbchip" data-kb="${esc(k)}">${esc(doc ? doc.n : k)}</button>`;
        }).join("")}</div>
      </div>

      <div class="fld">
        <h4>Run it</h4>
        <p style="color:var(--dim);font-size:.76rem;margin-bottom:.6rem">Fill the gold fields, copy, paste into whichever model you use.</p>
        ${vars.map(v => {
          const key = v.slice(2, -2);
          return `<div class="var">
            <label for="v-${key}">${esc(key)}</label>
            <textarea id="v-${key}" data-var="${esc(v)}" rows="1" placeholder="your ${esc(key.toLowerCase().replace(/_/g, " "))}…"></textarea>
          </div>`;
        }).join("")}
        <div class="skill">
          <div class="skill-bar">
            <span>The skill</span>
            <button class="mini" id="copy-raw">Raw</button>
            <button class="mini go" id="copy-filled">Copy</button>
          </div>
          <pre id="skill-pre">${hi(a.s)}</pre>
        </div>
      </div>
    </div>`;

  el("back-dir").addEventListener("click", () => { state.sel = null; applyDimming(); renderInspector(); syncHash(); });
  el("built-btn").addEventListener("click", () => {
    const on = !state.built.has(a.i);
    on ? state.built.add(a.i) : state.built.delete(a.i);
    saveBuilt(); paintCounts();
    const btn = el("built-btn");
    btn.setAttribute("aria-pressed", on);
    btn.querySelector(".bx").textContent = on ? "✓" : "";
    btn.querySelector("span:last-child").textContent = on ? "Built — running in your stack" : "Mark as built";
    renderLadder();
  });
  el("copy-raw").addEventListener("click", () => copy(a.s, "Raw skill copied"));
  el("copy-filled").addEventListener("click", () => copy(filledSkill(a), "Skill copied — paste it in"));
  el("insp").querySelectorAll("[data-var]").forEach(t2 => t2.addEventListener("input", () => {
    t2.style.height = "auto"; t2.style.height = Math.min(t2.scrollHeight, 160) + "px";
    el("skill-pre").innerHTML = hi(filledSkill(a));
  }));
  el("insp").querySelectorAll("[data-kb]").forEach(c =>
    c.addEventListener("click", () => { go({ level: "brain" }); selectKb(c.dataset.kb); }));
}

function renderKbDetail(k) {
  const readers = AGENTS.filter(a => a.k.includes(k.i));
  el("insp").innerHTML = `
    <div class="det-head">
      <p class="pth"><button class="mini" id="back-dir">← Brain</button></p>
      <p class="pth" style="margin-top:.5rem;color:var(--gold)">Knowledge document</p>
      <h2>${esc(k.n)}</h2>
      <div class="badges"><span class="badge">${readers.length} agents read this</span></div>
    </div>
    <div class="sect" style="border-bottom:none">
      <div class="fld"><p>${esc(k.d)}</p></div>
      <div class="fld"><h4>What goes in it</h4>
        <div class="kbdoc"><div class="tpl">${esc(k.t).split(" · ").map(x => "· " + x).join("<br>")}</div></div>
      </div>
      <div class="fld"><h4>Read by</h4>
        <div class="chiprow">${readers.slice(0, 24).map(a =>
          `<button class="kbchip" data-agent="${a.i}">${esc(a.n)}</button>`).join("")}
          ${readers.length > 24 ? `<span class="kbchip" style="border:none">+${readers.length - 24} more</span>` : ""}
        </div>
      </div>
    </div>`;
  el("back-dir").addEventListener("click", () => { state.selKb = null; applyDimming(); renderInspector(); });
  el("insp").querySelectorAll("[data-agent]").forEach(c =>
    c.addEventListener("click", () => { go({ level: "overview" }); selectAgent(c.dataset.agent); }));
}

/* ═══════════════════════════════════════════════════════════════════════════
   LADDER — the complete, no-SVG view. Must always list everything.
   ═══════════════════════════════════════════════════════════════════════ */
function renderLadder() {
  const live = AGENTS.filter(agentMatches);
  if (!live.length) { el("ladder").innerHTML = `<p class="dir-empty">Nothing matches.</p>`; return; }
  let h = "";
  for (const p of [1, 2, 3, 4]) {
    const rows = live.filter(a => a.p === p);
    if (!rows.length) continue;
    const ph = PHASES[p];
    h += `<section class="phase">
      <div class="phase-top">
        <h2>Phase ${p} — ${esc(ph.label)}</h2>
        <span class="w">${esc(ph.when)}</span>
        <span class="w" style="color:var(--faint)">${rows.length} agents</span>
        <p class="nt">${esc(ph.note)}</p>
      </div>
      ${p === 1 ? `<button class="lrow brain-row" id="lad-brain">
        <span class="i">00</span>
        <span class="nm">Write the ${BRAIN.length} brain documents<small style="color:var(--gold)">The centre · before any of the ${AGENTS.length}</small></span>
        <span class="rp">Replaces every agent guessing at your prices, proof and voice</span>
        <span class="tr" style="color:var(--gold)">Manual</span>
      </button>` : ""}`;
    rows.forEach((a, i) => {
      const d = deptOf(a);
      h += `<button class="lrow" data-agent="${a.i}">
        <span class="i">${state.built.has(a.i) ? "✓" : String(i + 1).padStart(2, "0")}</span>
        <span class="nm">${esc(a.n)}<small style="color:${d.c}">${esc(d.n)} · ${esc(branchOf(a).n)}</small></span>
        <span class="rp">Replaces: ${esc(a.r)}</span>
        <span class="tr" style="color:${TIERS[a.t].c}">${esc(TIERS[a.t].label)}</span>
      </button>`;
    });
    h += "</section>";
  }
  el("ladder").innerHTML = h;
  el("ladder").querySelectorAll("[data-agent]").forEach(b =>
    b.addEventListener("click", () => { setTab("map"); selectAgent(b.dataset.agent); }));
  const lb = el("lad-brain");
  if (lb) lb.addEventListener("click", () => go({ level: "brain" }));
}

/* ═══════════════════════════════════════════════════════════════════════════
   CHROME BITS
   ═══════════════════════════════════════════════════════════════════════ */
function buildRail() {
  el("rail-depts").innerHTML = DEPTS.map(d =>
    `<button class="rail-item" data-dept="${d.i}" style="--c:${d.c}">
      <span class="swatch"></span><span class="n">${esc(d.n)}</span>
      <span class="ct">${agentsInDept(d.i).length}</span>
    </button>`).join("");
  el("rail-depts").querySelectorAll("[data-dept]").forEach(b =>
    b.addEventListener("click", () => go({ level: "dept", dept: b.dataset.dept })));

  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => {
    const t = b.dataset.go;
    if (t === "overview") go({ level: "overview" });
    else if (t === "brain") go({ level: "brain" });
    else if (t === "ladder") { go({ level: "overview" }); setTab("ladder"); }
    else if (t === "built") {
      if (!state.built.size) return toast("Nothing marked built yet — open an agent and mark it");
      go({ level: "overview" }); setTab("ladder");
    }
  }));

  el("reset-built").addEventListener("click", () => {
    if (!state.built.size) return toast("Nothing to reset");
    state.built.clear(); saveBuilt(); paintCounts(); renderInspector(); renderLadder();
    toast("Progress cleared");
  });
}

function paintCounts() {
  el("rc-all").textContent = AGENTS.length;
  el("rc-brain").textContent = BRAIN.length;
  el("rc-built").textContent = state.built.size;
  el("live-count").textContent = AGENTS.length + " agents online";
}

function setTab(which) {
  state.tab = which;
  const map = which === "map";
  el("map-tab").setAttribute("aria-selected", map);
  el("ladder-tab").setAttribute("aria-selected", !map);
  el("canvas-wrap").hidden = !map;
  el("ladder").hidden = map;
}
el("map-tab").addEventListener("click", () => setTab("map"));
el("ladder-tab").addEventListener("click", () => { setTab("ladder"); renderLadder(); });
el("back-btn").addEventListener("click", up);

/* search */
let qt;
el("q").addEventListener("input", e => {
  clearTimeout(qt);
  qt = setTimeout(() => {
    state.q = e.target.value.trim().toLowerCase();
    applyDimming();
    if (!state.sel && !state.selKb) renderPanels();
    renderLadder();
  }, 130);
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== el("q")) { e.preventDefault(); el("q").focus(); }
  if (e.key === "Escape") {
    if (state.sel || state.selKb) { state.sel = null; state.selKb = null; applyDimming(); renderInspector(); syncHash(); }
    else if (VIEW.level !== "overview") up();
  }
});

/* tooltip — the only reason hover exists here; every action is still a click */
const tip = el("tip");
function showTip(ev, a) {
  if (N["agent:" + a.i].g.classList.contains("show-lbl")) return;
  const d = deptOf(a);
  showTipRaw(ev, a.n, d.n + " · " + branchOf(a).n + " · " + TIERS[a.t].label);
}
function showTipRaw(ev, title, sub) {
  tip.innerHTML = `<b>${esc(title)}</b><span>${esc(sub)}</span>`;
  tip.classList.add("on"); moveTip(ev);
}
function moveTip(ev) {
  const r = el("canvas-wrap").getBoundingClientRect();
  let x = ev.clientX - r.left + 14, y = ev.clientY - r.top + 14;
  if (x + tip.offsetWidth > r.width - 8) x = ev.clientX - r.left - tip.offsetWidth - 12;
  if (y + tip.offsetHeight > r.height - 8) y = ev.clientY - r.top - tip.offsetHeight - 12;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => tip.classList.remove("on");

function copy(text, msg) {
  navigator.clipboard.writeText(text).then(() => toast(msg))
    .catch(() => toast("Copy blocked — select the text and copy manually"));
}
let tt;
function toast(msg) {
  const t = el("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2200);
}

/* ═══════════════════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════════════ */
buildNodes();
buildRail();
paintCounts();

/* deep links, so a specific agent or department can be shared */
const h = location.hash;
let opened = false;
let m;
if ((m = h.match(/#agent=([\w-]+)/))) {
  const a = byId(AGENTS, m[1]);
  if (a) { VIEW.level = "branch"; VIEW.branch = a.b; state.sel = a.i; opened = true; }
} else if ((m = h.match(/#tree=([\w-]+)/))) {
  if (byId(BRANCHES, m[1])) { VIEW.level = "branch"; VIEW.branch = m[1]; opened = true; }
} else if ((m = h.match(/#dept=([\w-]+)/))) {
  if (byId(DEPTS, m[1])) { VIEW.level = "dept"; VIEW.dept = m[1]; opened = true; }
} else if (/#brain/.test(h)) { VIEW.level = "brain"; opened = true; }

render();
paintChrome();
renderInspector();
renderLadder();
setTab("map");
if (!opened) syncHash();
</script>
